# .pre-commit-config.yaml
default_language_version:
  python: python3

minimum_pre_commit_version: "3.2.0"

repos:
  # Linting + formatting using Ruff (faster than Black + Flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7  # pin for stable reproducibility
    hooks:
      - id: ruff
        args: ["--fix"]
        types_or: [python]
      - id: ruff-format
        types_or: [python]

  # Static type checking using Mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.1
    hooks:
      - id: mypy
        name: "mypy (strict mode)"
        args: ["--strict"]
        types: [python]
        additional_dependencies:
          - attrs==23.2.0  # match your runtime setup

  - repo: https://github.com/python-poetry/poetry
    rev: "2.1.3"
    hooks:
      - id: poetry-check
        stages: [commit]
      - id: poetry-lock
        stages: [commit]
