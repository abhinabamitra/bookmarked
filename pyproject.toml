[project]
name = "bookmarked"
version = "0.1.0"
description = "All your links in one place"
authors = [
    {name = "Abhinaba Mitra", email = "abhinabamitra19@gmail.com"}
]
readme = "README.md"

[tool.poetry]
packages = [
    {include = "bookmarked"}
]

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
ruff = "^0.12.7"
mypy = "^1.17.1"
attrs = "^25.3.0"

[tool.mypy]
python_version = "3.12"
files = ["bookmarked/"]
strict = true

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
select = ["ALL"]
indent-width = 4
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true